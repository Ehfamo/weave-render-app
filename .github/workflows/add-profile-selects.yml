name: Add localized profile selects

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update profile fields
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path("src/routes/profile-edit.tsx")
          source = path.read_text(encoding="utf-8")

          old_import = '''import { useEffect, useMemo, useRef, useState } from "react";'''

          new_import = '''import { useEffect, useMemo, useRef, useState } from "react";
          import { m } from "@/paraglide/messages.js";
          import { getLocale } from "@/paraglide/runtime.js";'''

          if old_import in source:
              source = source.replace(old_import, new_import, 1)
          elif "@/paraglide/messages.js" not in source:
              raise SystemExit("React import was not found.")

          availability = '''type Availability = "idle" | "checking" | "available" | "taken" | "invalid";'''

          helpers = '''type Availability = "idle" | "checking" | "available" | "taken" | "invalid";

          const ACTIVE_LOCALES = ["en", "fa", "ar", "zh", "hi"] as const;

          type ActiveLocale = (typeof ACTIVE_LOCALES)[number];

          const COUNTRY_CODES = `
          AF AL DZ AD AO AG AR AM AU AT AZ BS BH BD BB BY BE BZ BJ BT BO BA BW BR
          BN BG BF BI CV KH CM CA CF TD CL CN CO KM CG CD CR CI HR CU CY CZ DK DJ
          DM DO EC EG SV GQ ER EE SZ ET FJ FI FR GA GM GE DE GH GR GD GT GN GW GY
          HT HN HU IS IN ID IR IQ IE IL IT JM JP JO KZ KE KI KP KR KW KG LA LV LB
          LS LR LY LI LT LU MG MW MY MV ML MT MH MR MU MX FM MD MC MN ME MA MZ MM
          NA NR NP NL NZ NI NE NG MK NO OM PK PW PS PA PG PY PE PH PL PT QA RO RU
          RW KN LC VC WS SM ST SA SN RS SC SL SG SK SI SB SO ZA SS ES LK SD SR SE
          CH SY TW TJ TZ TH TL TG TO TT TN TR TM TV UG UA AE GB US UY UZ VU VA VE
          VN YE ZM ZW
          `
            .trim()
            .split(/\\s+/);

          function getCurrentLocale(): ActiveLocale {
            const locale = getLocale();

            return ACTIVE_LOCALES.includes(locale as ActiveLocale)
              ? (locale as ActiveLocale)
              : "en";
          }

          function getTimezones(): string[] {
            const currentTimezone =
              Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";

            const intlApi = Intl as typeof Intl & {
              supportedValuesOf?: (key: "timeZone") => string[];
            };

            return intlApi.supportedValuesOf?.("timeZone") ?? [currentTimezone];
          }'''

          if "const ACTIVE_LOCALES =" not in source:
              if availability not in source:
                  raise SystemExit("Availability type was not found.")

              source = source.replace(availability, helpers, 1)

          old_file_ref = '''  const fileRef = useRef<HTMLInputElement>(null);'''

          new_file_ref = '''  const fileRef = useRef<HTMLInputElement>(null);
            const currentLocale = getCurrentLocale();

            const regionNames = useMemo(
              () => new Intl.DisplayNames([currentLocale], { type: "region" }),
              [currentLocale],
            );

            const languageNames = useMemo(
              () => new Intl.DisplayNames([currentLocale], { type: "language" }),
              [currentLocale],
            );

            const countryOptions = useMemo(
              () =>
                COUNTRY_CODES.map((code) => ({
                  value: code,
                  label: regionNames.of(code) ?? code,
                })).sort((a, b) =>
                  a.label.localeCompare(b.label, currentLocale),
                ),
              [currentLocale, regionNames],
            );

            const languageOptions = useMemo(
              () =>
                ACTIVE_LOCALES.map((code) => ({
                  value: code,
                  label: languageNames.of(code) ?? code,
                })),
              [languageNames],
            );

            const timezoneOptions = useMemo(
              () =>
                getTimezones()
                  .map((value) => ({
                    value,
                    label: value.replaceAll("_", " "),
                  }))
                  .sort((a, b) =>
                    a.label.localeCompare(b.label, currentLocale),
                  ),
              [currentLocale],
            );'''

          if "const countryOptions = useMemo" not in source:
              if old_file_ref not in source:
                  raise SystemExit("fileRef was not found.")

              source = source.replace(old_file_ref, new_file_ref, 1)

          source = source.replace(
              '''  const [language, setLanguage] = useState("");''',
              '''  const [language, setLanguage] = useState<ActiveLocale>(getCurrentLocale());''',
              1,
          )

          source = source.replace(
              '''        setLanguage(data.language ?? "");''',
              '''        setLanguage(
                  ACTIVE_LOCALES.includes(data.language as ActiveLocale)
                    ? (data.language as ActiveLocale)
                    : currentLocale,
                );''',
              1,
          )

          source = source.replace(
              '''      } else {
                setTimezone(tz);
              }''',
              '''      } else {
                setLanguage(currentLocale);
                setTimezone(tz);
              }''',
              1,
          )

          source = source.replace(
              '''  }, [user]);''',
              '''  }, [currentLocale, user]);''',
              1,
          )

          old_fields = '''              <Field label="Country" icon={MapPin}>
                        <Input value={country} onChange={setCountry} autoComplete="country-name" />
                      </Field>
                      <Field label="Language" icon={Languages}>
                        <Input value={language} onChange={setLanguage} autoComplete="language" />
                      </Field>
                      <Field label="Timezone" icon={Clock}>
                        <Input value={timezone} onChange={setTimezone} />
                      </Field>'''

          new_fields = '''              <Field label={m.profile_edit_country_label()} icon={MapPin}>
                        <select
                          value={country}
                          onChange={(event) => setCountry(event.target.value)}
                          className="w-full rounded-xl border border-white/10 bg-[#100b0f] px-4 py-3 text-sm text-white outline-none transition focus:border-[#ff8a3d]"
                        >
                          <option value="">
                            {m.profile_edit_country_placeholder()}
                          </option>
                          {countryOptions.map((option) => (
                            <option key={option.value} value={option.value}>
                              {option.label}
                            </option>
                          ))}
                        </select>
                      </Field>

                      <Field label={m.language()} icon={Languages}>
                        <select
                          value={language}
                          onChange={(event) =>
                            setLanguage(event.target.value as ActiveLocale)
                          }
                          className="w-full rounded-xl border border-white/10 bg-[#100b0f] px-4 py-3 text-sm text-white outline-none transition focus:border-[#ff8a3d]"
                        >
                          {languageOptions.map((option) => (
                            <option key={option.value} value={option.value}>
                              {option.label}
                            </option>
                          ))}
                        </select>
                      </Field>

                      <Field label={m.profile_edit_timezone_label()} icon={Clock}>
                        <select
                          value={timezone}
                          onChange={(event) => setTimezone(event.target.value)}
                          className="w-full rounded-xl border border-white/10 bg-[#100b0f] px-4 py-3 text-sm text-white outline-none transition focus:border-[#ff8a3d]"
                        >
                          <option value="">
                            {m.profile_edit_timezone_placeholder()}
                          </option>
                          {timezoneOptions.map((option) => (
                            <option key={option.value} value={option.value}>
                              {option.label}
                            </option>
                          ))}
                        </select>
                      </Field>'''

          if old_fields not in source:
              raise SystemExit("The three original profile fields were not found.")

          source = source.replace(old_fields, new_fields, 1)
          path.write_text(source, encoding="utf-8")

          translations = {
              "en": {
                  "profile_edit_country_label": "Country",
                  "profile_edit_country_placeholder": "Select a country",
                  "profile_edit_timezone_label": "Timezone",
                  "profile_edit_timezone_placeholder": "Select a timezone",
              },
              "fa": {
                  "profile_edit_country_label": "کشور",
                  "profile_edit_country_placeholder": "یک کشور انتخاب کنید",
                  "profile_edit_timezone_label": "منطقه زمانی",
                  "profile_edit_timezone_placeholder": "یک منطقه زمانی انتخاب کنید",
              },
              "ar": {
                  "profile_edit_country_label": "الدولة",
                  "profile_edit_country_placeholder": "اختر دولة",
                  "profile_edit_timezone_label": "المنطقة الزمنية",
                  "profile_edit_timezone_placeholder": "اختر منطقة زمنية",
              },
              "zh": {
                  "profile_edit_country_label": "国家或地区",
                  "profile_edit_country_placeholder": "选择国家或地区",
                  "profile_edit_timezone_label": "时区",
                  "profile_edit_timezone_placeholder": "选择时区",
              },
              "hi": {
                  "profile_edit_country_label": "देश",
                  "profile_edit_country_placeholder": "देश चुनें",
                  "profile_edit_timezone_label": "समय क्षेत्र",
                  "profile_edit_timezone_placeholder": "समय क्षेत्र चुनें",
              },
          }

          for locale, messages in translations.items():
              message_path = Path(f"messages/{locale}.json")
              data = json.loads(message_path.read_text(encoding="utf-8"))
              data.update(messages)

              message_path.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )

          print("Localized profile selects added.")
          PY

      - name: Format files
        run: |
          npx prettier --write \
            src/routes/profile-edit.tsx \
            messages/en.json \
            messages/fa.json \
            messages/ar.json \
            messages/zh.json \
            messages/hi.json

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git add \
            src/routes/profile-edit.tsx \
            messages/en.json \
            messages/fa.json \
            messages/ar.json \
            messages/zh.json \
            messages/hi.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "fix(profile): add multilingual profile selects"
          git push origin HEAD:main
