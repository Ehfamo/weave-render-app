name: XEOMX Browser Run Probe
# search-discovery-probe

on:
  push:
    branches:
      - staging/xeomx-request7-cloudflare-live
    paths:
      - .github/workflows/browser-run-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Staging search discovery
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS https://xeomx-request7-staging.ehfamo7830.workers.dev/__xeomx/search-probe)"
          printf '%s\n' "$body"
          BODY="$body" node - <<'NODE'
          const body = JSON.parse(process.env.BODY || '{}');
          if (!body.ok) {
            console.error('SEARCH_DISCOVERY_PROBE_FAILED', body);
            process.exit(1);
          }
          console.log('SEARCH_DISCOVERY_PROBE_PASS');
          NODE
