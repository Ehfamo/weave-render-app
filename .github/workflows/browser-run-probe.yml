name: XEOMX Browser Run Probe
# worker-binding-probe

on:
  push:
    branches:
      - staging/xeomx-request7-cloudflare-live
    paths:
      - .github/workflows/browser-run-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Staging Browser Run binding
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS https://xeomx-request7-staging.ehfamo7830.workers.dev/__xeomx/browser-probe)"
          printf '%s\n' "$body"
          BODY="$body" node - <<'NODE'
          const body = JSON.parse(process.env.BODY || '{}');
          if (!body.ok || body.upstream_status !== 200 || !body.markdown_present) {
            console.error('BROWSER_BINDING_PROBE_FAILED', body);
            process.exit(1);
          }
          console.log('BROWSER_BINDING_PROBE_PASS');
          NODE
