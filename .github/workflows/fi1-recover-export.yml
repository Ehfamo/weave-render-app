name: XEOMX FI1 Exact Recovery Export

on:
  push:
    branches:
      - recovery/xeomx-fi1-export-20260915

permissions:
  contents: write

jobs:
  recover-fi1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch preservation source
        run: |
          git fetch origin preservation/xeomx-fi1-recovery-20260915
          git cat-file -e e14edacdcbb9705298a4865ca5d38e3f746ef202^{commit}

      - name: Reconstruct verified FI1 patch artifact
        run: |
          : > /tmp/XEOMX_FI1_RECOVERY.patch.gz
          for p in 00 01 02 03 04 05 06 07; do
            git show origin/preservation/xeomx-fi1-recovery-20260915:artifacts/fi1-preservation/chunks/part-${p} >> /tmp/XEOMX_FI1_RECOVERY.patch.gz
          done
          ACTUAL_SHA="$(sha256sum /tmp/XEOMX_FI1_RECOVERY.patch.gz | awk '{print $1}')"
          echo "PATCH_SHA256=${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "f6ed7cef521734a5e37a4b891634f42f4cd25ce55f1e4c232586db1c4a0a8472"
          gzip -t /tmp/XEOMX_FI1_RECOVERY.patch.gz
          gzip -dc /tmp/XEOMX_FI1_RECOVERY.patch.gz > /tmp/XEOMX_FI1_RECOVERY.patch
          echo "PATCH_COMMIT_HEADERS_BEGIN"
          grep -E '^(From [0-9a-f]{40} |From: |Date: |Subject: )' /tmp/XEOMX_FI1_RECOVERY.patch
          echo "PATCH_COMMIT_HEADERS_END"

      - name: Reproduce FI1 commits exactly from verified patch
        run: |
          git checkout -B feature/xeomx-fi1-core-execution-20260914 e14edacdcbb9705298a4865ca5d38e3f746ef202
          git config user.name Codex
          git config user.email codex@openai.com
          git am --committer-date-is-author-date /tmp/XEOMX_FI1_RECOVERY.patch
          RESULT_HEAD="$(git rev-parse HEAD)"
          echo "FI1_RECOVERED_HEAD=${RESULT_HEAD}"
          echo "FI1_REQUIRED_HEAD=dcafa525ebae0cf126e7470be3ca9de8065274aa"
          git log --format=fuller -3
          test "${RESULT_HEAD}" = "dcafa525ebae0cf126e7470be3ca9de8065274aa"
          git merge-base --is-ancestor e14edacdcbb9705298a4865ca5d38e3f746ef202 HEAD
          test "$(git rev-list --count e14edacdcbb9705298a4865ca5d38e3f746ef202..HEAD)" = "2"

      - name: Persist exact FI1 remote branch
        run: |
          git push origin HEAD:refs/heads/feature/xeomx-fi1-core-execution-20260914

      - name: Export exact FI1 workspace
        run: |
          git archive --format=tar.gz -o /tmp/XEOMX_FI1_EXACT_WORKSPACE_20260915.tar.gz HEAD
          sha256sum /tmp/XEOMX_FI1_EXACT_WORKSPACE_20260915.tar.gz > /tmp/XEOMX_FI1_EXACT_WORKSPACE_20260915.tar.gz.sha256

      - name: Upload exact FI1 workspace
        uses: actions/upload-artifact@v4
        with:
          name: XEOMX_FI1_EXACT_WORKSPACE_20260915
          path: |
            /tmp/XEOMX_FI1_EXACT_WORKSPACE_20260915.tar.gz
            /tmp/XEOMX_FI1_EXACT_WORKSPACE_20260915.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
