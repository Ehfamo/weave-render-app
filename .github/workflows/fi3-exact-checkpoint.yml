name: Preserve exact FI3 interrupted history
on:
  push:
    branches: [preservation/xeomx-fi3-interrupted-20260921]
    paths:
      - .github/workflows/fi3-exact-checkpoint.yml
      - artifacts/fi3-preservation/**
permissions:
  contents: write
jobs:
  recover-exact-fi3:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify bundle and persist exact FI3 branch without rewriting
        shell: bash
        run: |
          set -euo pipefail
          bundle=artifacts/fi3-preservation/XEOMX_FI3_INTERRUPTED_CHECKPOINT_20260921.bundle
          expected=f752b36ecea11ce99972427948916f9e9d52b44c
          target=refs/heads/feature/xeomx-fi3-capability-runtime-20260915
          echo "691f33cf2a6a412de4f1270f4ba9a0c136ce43d703d589261a2a9ba8b0d0150d  $bundle" | sha256sum --check -
          git cat-file -e 9b6f077baf2a4bf72edaf22ed71da4492d33c18e^{commit}
          git bundle verify "$bundle"
          test "$(git bundle list-heads "$bundle" "$target" | cut -d' ' -f1)" = "$expected"
          git fetch "$bundle" "$target:refs/heads/recovered-fi3-checkpoint"
          git merge-base --is-ancestor 9b6f077baf2a4bf72edaf22ed71da4492d33c18e "$expected"
          git push origin "$expected:$target"
          test "$(git ls-remote origin "$target" | cut -f1)" = "$expected"
