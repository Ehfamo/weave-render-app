name: Preserve exact FI3 September 22 closure
on:
  push:
    branches: [preservation/xeomx-fi3-final-20260922]
    paths:
      - .github/workflows/fi3-exact-final.yml
      - artifacts/fi3-preservation/XEOMX_FI3_FINAL_CLOSURE_20260922.bundle
permissions:
  contents: write
jobs:
  recover-exact-fi3:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact bundle and update only FI3 without force
        shell: bash
        run: |
          set -euo pipefail
          bundle=artifacts/fi3-preservation/XEOMX_FI3_FINAL_CLOSURE_20260922.bundle
          expected=b33248cb7cd0fb27f76d74b2dab60c265fba84a7
          target=refs/heads/feature/xeomx-fi3-capability-runtime-20260915
          echo "de1b807a93e26b04f271828ad0f003122692a8288c83d9fba00fa1af58377d2d  $bundle" | sha256sum --check -
          git cat-file -e 9b6f077baf2a4bf72edaf22ed71da4492d33c18e^{commit}
          git bundle verify "$bundle"
          test "$(git bundle list-heads "$bundle" "$target" | cut -d' ' -f1)" = "$expected"
          git fetch "$bundle" "$target:refs/heads/recovered-fi3-final"
          git merge-base --is-ancestor 9b6f077baf2a4bf72edaf22ed71da4492d33c18e "$expected"
          git merge-base --is-ancestor dcafa525ebae0cf126e7470be3ca9de8065274aa "$expected"
          git push origin "$expected:$target"
          test "$(git ls-remote origin "$target" | cut -f1)" = "$expected"
