name: Preserve exact final FI5 history
on:
  push:
    branches: [preservation/xeomx-fi5-final-20260930]
    paths:
      - .github/workflows/fi5-final-preservation.yml
      - artifacts/fi5-preservation/XEOMX_FI5_FINAL_CLOSURE_20260930.bundle
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify final bundle and normally advance only FI5
        shell: bash
        run: |
          set -euo pipefail
          bundle=artifacts/fi5-preservation/XEOMX_FI5_FINAL_CLOSURE_20260930.bundle
          expected=cba07c197f3278efec81d125c969f25a406fd958
          target=refs/heads/feature/xeomx-fi5-marketplace-commerce-lifecycle-20260924
          echo "cd88f216dcb2e45e81e443bfc22a63375338618b2dd3d347149b243b132cb75c  $bundle" | sha256sum --check -
          git bundle verify "$bundle"
          test "$(git bundle list-heads "$bundle" "$target" | cut -d' ' -f1)" = "$expected"
          git fetch "$bundle" "$target:refs/heads/recovered-final-fi5"
          git merge-base --is-ancestor b8238f9ed6c82399f89fbc80ba2a8c61d398de60 "$expected"
          git push origin "$expected:$target"
          test "$(git ls-remote origin "$target" | cut -f1)" = "$expected"
