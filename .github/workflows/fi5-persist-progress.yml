name: Persist exact FI5 progress
on:
  push:
    branches: [preservation/xeomx-fi5-recovery-20260929]
    paths: [.github/workflows/fi5-persist-progress.yml, 'artifacts/fi5-preservation/*.bundle']
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and persist exact checkpoint
        shell: bash
        run: |
          set -euo pipefail
          bundle=artifacts/fi5-preservation/XEOMX_FI5_CHECKPOINT_02_20260929.bundle
          expected=3e01e4d9fd8f40b658d7437f369687de685eef2f
          target=refs/heads/feature/xeomx-fi5-marketplace-commerce-lifecycle-20260924
          echo "43eff1379511d33e679d15c163fe0674e1729f5f6b09653e9e309d2093699776  $bundle" | sha256sum --check -
          git bundle verify "$bundle"
          test "$(git bundle list-heads "$bundle" "$target" | cut -d' ' -f1)" = "$expected"
          git fetch "$bundle" "$target:refs/heads/recovered-fi5"
          git merge-base --is-ancestor b8238f9ed6c82399f89fbc80ba2a8c61d398de60 "$expected"
          git push origin "$expected:$target"
          test "$(git ls-remote origin "$target" | cut -f1)" = "$expected"
