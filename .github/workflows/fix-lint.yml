name: Fix Lint Errors

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix control-regex lint rule
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/contact.functions.ts")
          content = path.read_text()

          rule = "/* eslint-disable no-control-regex */\n"

          if not content.startswith(rule):
              path.write_text(rule + content)
          PY

      - name: Format affected files
        run: |
          npx prettier --write \
            src/lib/contact.functions.ts \
            src/routes/profile-edit.tsx

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi

          git add src/lib/contact.functions.ts src/routes/profile-edit.tsx
          git commit -m "fix: resolve lint errors"
          git push
