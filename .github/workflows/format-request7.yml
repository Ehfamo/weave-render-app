name: Format Request7 Staging

on:
  push:
    branches:
      - staging/xeomx-request7-cloudflare-live
    paths:
      - src/components/xeomx/product/ProjectWorkspace.tsx
      - src/routes/_authenticated/projects.tsx
      - src/lib/backend/**
      - src/server.ts
      - .github/workflows/format-request7.yml

permissions:
  contents: write

concurrency:
  group: xeomx-request7-format
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Request7 source
        run: npx prettier --write src/components/xeomx/product/ProjectWorkspace.tsx src/routes/_authenticated/projects.tsx src/lib/backend/vertical-slice.ts src/lib/backend/vertical-slice.database.ts src/lib/backend/vertical-slice.functions.ts src/lib/backend/vertical-slice.server.ts src/server.ts
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/xeomx/product/ProjectWorkspace.tsx src/routes/_authenticated/projects.tsx src/lib/backend src/server.ts
          if git diff --cached --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git commit -m "style: format Request7 staging source"
          git push origin HEAD:staging/xeomx-request7-cloudflare-live
