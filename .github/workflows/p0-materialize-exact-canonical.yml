name: XEOMX P0 Materialize Exact Canonical

on:
  push:
    branches:
      - plan/xeomx-platform-expansion-20260909
    paths:
      - .github/workflows/p0-materialize-exact-canonical.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/xeomx-platform-expansion-20260909
          fetch-depth: 0
      - name: Materialize exact recovered canonical sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          payloads = {
            'src/lib/core-workflows.ts': ('fce4fb9d01bafd808f45dcd241323ab5c99ada8057f757a10f11afaf93b023f1', 18262, ''),
            'src/lib/platform-contracts.ts': ('840e9e012c244652492021223bbd55ae562bf702f06b65d03a67d81c50d5c4f2', 21587, ''),
            'src/components/xeomx/product/ProductWorkspacePreview.tsx': ('5504a029910f04541f61b7876fe2df60ab18e2d18f188a2e89d823302f948a11', 31144, ''),
            'src/lib/product-architecture.ts': ('4fed3a9cac34ab1c400f545438406802ee8c2dd2e8deac244cbd9dcba9b09ab3', 55566, ''),
          }
          for path, (expected_sha, expected_bytes, payload_b64) in payloads.items():
              data = lzma.decompress(base64.b64decode(payload_b64))
              actual_sha = hashlib.sha256(data).hexdigest()
              actual_bytes = len(data)
              print(f'PREWRITE {path} bytes={actual_bytes} sha256={actual_sha}')
              if actual_sha != expected_sha or actual_bytes != expected_bytes:
                  raise SystemExit(f'RECOVERED_BODY_MISMATCH {path}')
              p = pathlib.Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
              reread = p.read_bytes()
              if hashlib.sha256(reread).hexdigest() != expected_sha or len(reread) != expected_bytes:
                  raise SystemExit(f'POSTWRITE_MISMATCH {path}')
              if b'\r\n' in reread:
                  raise SystemExit(f'UNEXPECTED_CRLF {path}')
              reread.decode('utf-8')
              print(f'EXACT_MATERIALIZATION_PASS {path}')
          PY
          sha256sum src/lib/core-workflows.ts src/lib/platform-contracts.ts src/components/xeomx/product/ProductWorkspacePreview.tsx src/lib/product-architecture.ts
          wc -c src/lib/core-workflows.ts src/lib/platform-contracts.ts src/components/xeomx/product/ProductWorkspacePreview.tsx src/lib/product-architecture.ts
      - name: Commit exact canonical sources only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/p0-materialize-exact-canonical.yml
          git add src/lib/core-workflows.ts src/lib/platform-contracts.ts src/components/xeomx/product/ProductWorkspacePreview.tsx src/lib/product-architecture.ts .github/workflows/p0-materialize-exact-canonical.yml
          git diff --cached --check
          git commit -m "fix(p0): restore exact canonical architecture sources"
          git push origin HEAD:plan/xeomx-platform-expansion-20260909
