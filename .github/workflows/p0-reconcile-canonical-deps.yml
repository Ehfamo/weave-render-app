name: XEOMX P0 Reconcile Canonical Dependencies

on:
  push:
    branches:
      - plan/xeomx-platform-expansion-20260909
    paths:
      - .github/workflows/p0-reconcile-canonical-deps.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/xeomx-platform-expansion-20260909
          fetch-depth: 0
      - name: Restore exact Stage5.4 dependency closure
        shell: bash
        env:
          PAYLOAD_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PAYLOAD_B64" | base64 -d > /tmp/p0-deps.tar.xz
          echo "35ebe73e94ce5238c00f0549c10f1837d8eb067754dd1b6433627ab09524b894  /tmp/p0-deps.tar.xz" | sha256sum -c -
          xz -t /tmp/p0-deps.tar.xz
          tar -xJf /tmp/p0-deps.tar.xz -C .
          cat > /tmp/expected.tsv <<'EOF'
550223a2e49eb034d8cce1dafde602b22d98f420a2a6dc31a0e829085f85b289 4587 src/components/xeomx/os/SystemState.tsx
bf00fb22a9e59876e391a27a4a558a9d0f1c949311ae5e5fd5f83a24a9a5dbb7 4744 src/components/xeomx/product/JobStatusPanel.tsx
2a101901e9b9b6533d4a1b1dd0d7f8740387766db83b19b2f8cbf878814c092b 9489 src/components/xeomx/product/ModelIntelligenceWorkspace.tsx
6cf09cb79171981f2c150aead7f9e1bcd44b8d52a5d282adff05c5130ca41ba1 3065 src/components/xeomx/product/PaymentSafetyPanel.tsx
fab6a1848302f9e3179583c82dd13a83f0d7aa47ecda131be7ba6fdc57de566e 6706 src/components/xeomx/product/PermissionPreviewPanel.tsx
39236906d509bb7879755c375f1f7a5e9e3d3e71cc5d64ee19a5a75d51a98bb2 8405 src/components/xeomx/product/PersonalOSOverview.tsx
57ccc2c873f8369fbc00196c93dc029193cb719eb8c77480b3b0aa23cd23d05f 3081 src/components/xeomx/product/SecurityIncidentPanel.tsx
4e5b9b9b356d84c5bc5ac38205a94d9161af3ac364be4325204b2d031c9efc64 1016 src/hooks/use-product-complexity-mode.ts
3fc76385948e42a523738b0c7583fa0b7c731e9ce737b2c304feb18e729e6b0d 12524 src/lib/xeomx-os.ts
6d943dfd18a1005b16f5f57007295cc212e01eeabb8e58daf87112a1478180dc 3271 src/components/xeomx/status/OperationStateBadge.tsx
aaa6654e70112b709ee8fa957b39ace96fa583cf0fce271ecf077271e3cc32e7 1554 src/lib/project-context.ts
11ea8beb323c201f882ebeb56c20aa9fbeca5e23c2d7552b4347bdb7f69ed320 641 src/components/xeomx/os/project-context.ts
EOF
          while read -r expected_sha expected_bytes path; do
            actual_sha=$(sha256sum "$path" | awk '{print $1}')
            actual_bytes=$(wc -c < "$path")
            echo "VERIFY $path bytes=$actual_bytes sha256=$actual_sha"
            test "$actual_sha" = "$expected_sha"
            test "$actual_bytes" = "$expected_bytes"
          done < /tmp/expected.tsv
      - name: Commit dependency closure only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/p0-reconcile-canonical-deps.yml
          git add src/components/xeomx/os/SystemState.tsx src/components/xeomx/os/project-context.ts src/components/xeomx/product/JobStatusPanel.tsx src/components/xeomx/product/ModelIntelligenceWorkspace.tsx src/components/xeomx/product/PaymentSafetyPanel.tsx src/components/xeomx/product/PermissionPreviewPanel.tsx src/components/xeomx/product/PersonalOSOverview.tsx src/components/xeomx/product/SecurityIncidentPanel.tsx src/components/xeomx/status/OperationStateBadge.tsx src/hooks/use-product-complexity-mode.ts src/lib/project-context.ts src/lib/xeomx-os.ts .github/workflows/p0-reconcile-canonical-deps.yml
          git diff --cached --check
          git commit -m "fix(p0): reconcile recovered canonical dependencies"
          git push origin HEAD:plan/xeomx-platform-expansion-20260909
