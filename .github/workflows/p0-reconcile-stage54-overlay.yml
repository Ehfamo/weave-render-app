name: XEOMX P0 Reconcile Stage5.4 Overlay

on:
  push:
    branches:
      - plan/xeomx-platform-expansion-20260909
    paths:
      - .github/workflows/p0-reconcile-stage54-overlay.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/xeomx-platform-expansion-20260909
          fetch-depth: 0
      - name: Reconstruct exact Stage5.4 overlay
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin payload/stage54-core-v2-20260815:refs/remotes/origin/payload/stage54-core-v2-20260815
          REF=origin/payload/stage54-core-v2-20260815
          mapfile -t chunks < <(git ls-tree -r --name-only "$REF" .xeomx-stage54-core-v2 | sort -V)
          test ${#chunks[@]} -gt 0
          : > /tmp/stage54.b64
          for f in "${chunks[@]}"; do git show "$REF:$f" >> /tmp/stage54.b64; done
          base64 -d /tmp/stage54.b64 > /tmp/stage54.tar.xz
          xz -t /tmp/stage54.tar.xz
          mkdir -p /tmp/stage54
          tar -xJf /tmp/stage54.tar.xz -C /tmp/stage54
          echo "OVERLAY_FILES=$(find /tmp/stage54 -type f | wc -l)"
          test "$(find /tmp/stage54 -type f | wc -l)" -eq 59
          test "$(sha256sum /tmp/stage54/package.json | awk '{print $1}')" = "cbbc6aef37f0018eec592bccf22f0995d4eaf68634921d78d156ca8836ed4181"
          test "$(sha256sum /tmp/stage54/package-lock.json | awk '{print $1}')" = "c5340cf78e852c4ba0ac5ad3afe34a706323dfd37de46a2cf4f43f5dfa9d3b8d"
      - name: Apply Stage5.4 overlay and verify canonical sources remain exact
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/stage54/. .
          test "$(wc -c < src/lib/core-workflows.ts)" -eq 18262
          test "$(sha256sum src/lib/core-workflows.ts | awk '{print $1}')" = "fce4fb9d01bafd808f45dcd241323ab5c99ada8057f757a10f11afaf93b023f1"
          test "$(wc -c < src/lib/platform-contracts.ts)" -eq 21587
          test "$(sha256sum src/lib/platform-contracts.ts | awk '{print $1}')" = "840e9e012c244652492021223bbd55ae562bf702f06b65d03a67d81c50d5c4f2"
          test "$(wc -c < src/components/xeomx/product/ProductWorkspacePreview.tsx)" -eq 31144
          test "$(sha256sum src/components/xeomx/product/ProductWorkspacePreview.tsx | awk '{print $1}')" = "5504a029910f04541f61b7876fe2df60ab18e2d18f188a2e89d823302f948a11"
          test "$(wc -c < src/lib/product-architecture.ts)" -eq 55566
          test "$(sha256sum src/lib/product-architecture.ts | awk '{print $1}')" = "4fed3a9cac34ab1c400f545438406802ee8c2dd2e8deac244cbd9dcba9b09ab3"
          echo '=== CHANGED PATHS ==='
          git status --short
          echo '=== DIFF CHECK ==='
          git diff --check
      - name: Commit exact Stage5.4 source-tree reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/p0-reconcile-stage54-overlay.yml .github/workflows/p0-reconcile-canonical-deps.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(p0): reconcile recovered canonical dependencies"
          git push origin HEAD:plan/xeomx-platform-expansion-20260909
