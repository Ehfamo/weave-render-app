name: XEOMX RC1 Verified Payload Check

on:
  push:
    branches:
      - verify/rc1-verified-payload-check-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Identify reconstruction payload encoding
        shell: bash
        run: |
          set -euo pipefail
          files=$(find .xeomx -maxdepth 1 -type f -name 'chunk-*' | sort)
          echo "CHUNKS=$(printf '%s\n' "$files" | wc -l)"
          cat $files > /tmp/payload.b64
          base64 --decode /tmp/payload.b64 > /tmp/payload.bin
          echo "DECODED_BYTES=$(wc -c </tmp/payload.bin)"
          sha256sum /tmp/payload.bin
          file /tmp/payload.bin
          printf 'MAGIC='; head -c 32 /tmp/payload.bin | od -An -tx1 | tr -d ' \n'; echo
          if gzip -t /tmp/payload.bin 2>/dev/null; then echo FORMAT=gzip; fi
          if xz -t /tmp/payload.bin 2>/dev/null; then echo FORMAT=xz; fi
          if unzip -t /tmp/payload.bin >/dev/null 2>&1; then echo FORMAT=zip; fi
          if head -c 16 /tmp/payload.bin | grep -q '^diff --git'; then echo FORMAT=raw_git_patch; fi
