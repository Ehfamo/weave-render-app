name: XEOMX RC1 Verified Payload Check

on:
  push:
    branches:
      - verify/rc1-verified-payload-check-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate XZ reconstruction payload
        shell: bash
        run: |
          set -euo pipefail
          files=$(find .xeomx -maxdepth 1 -type f -name 'chunk-*' | sort)
          cat $files > /tmp/payload.b64
          base64 --decode /tmp/payload.b64 > /tmp/payload.xz
          echo '6a1f05fa28330519728f7baf55872160831f6942d20b7736a002627d67b6504f  /tmp/payload.xz' | sha256sum -c -
          xz -t /tmp/payload.xz
          xz -dc /tmp/payload.xz > /tmp/payload.out
          echo "OUT_BYTES=$(wc -c </tmp/payload.out)"
          sha256sum /tmp/payload.out
          file /tmp/payload.out
          printf 'OUT_MAGIC='; head -c 32 /tmp/payload.out | od -An -tx1 | tr -d ' \n'; echo
          if head -c 16 /tmp/payload.out | grep -q '^diff --git'; then
            echo FORMAT=raw_git_patch
            git apply --check /tmp/payload.out
            echo PATCH_APPLY_CHECK=PASS
          elif tar -tf /tmp/payload.out >/tmp/tar-list.txt 2>/dev/null; then
            echo FORMAT=tar
            echo "TAR_FILES=$(wc -l </tmp/tar-list.txt)"
            head -20 /tmp/tar-list.txt
          else
            echo FORMAT=unknown
            exit 2
          fi
