name: XEOMX RC1 Verified Payload Check

on:
  push:
    branches:
      - verify/rc1-verified-payload-check-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate reconstruction payload only
        shell: bash
        run: |
          set -euo pipefail
          echo "CHUNKS=$(find .xeomx -maxdepth 1 -type f -name 'chunk-*' | sort | wc -l)"
          find .xeomx -maxdepth 1 -type f -name 'chunk-*' -printf '%f %s\n' | sort
          cat $(find .xeomx -maxdepth 1 -type f -name 'chunk-*' | sort) > /tmp/payload.b64
          echo "B64_BYTES=$(wc -c </tmp/payload.b64)"
          base64 --decode /tmp/payload.b64 > /tmp/payload.gz
          gzip -t /tmp/payload.gz
          gzip -dc /tmp/payload.gz > /tmp/payload.patch
          echo "PATCH_BYTES=$(wc -c </tmp/payload.patch)"
          sha256sum /tmp/payload.patch
          git apply --check /tmp/payload.patch
          echo "PAYLOAD_VALID=1"
