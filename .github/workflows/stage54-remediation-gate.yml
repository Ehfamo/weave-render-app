name: XEOMX Stage5.4 Remediation Gate

on:
  push:
    branches:
      - verify/stage5-4-exact-golden-20260815
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      STAGING_BRANCH: staging/xeomx-request7-cloudflare-live
      PAYLOAD_BRANCH: payload/stage54-core-v2-20260815
      CORE_ARCHIVE_SHA256: e5e99cfea3ccdbe206e5e19104ff4890837ecf7d4dadc15cc3f140eaf5c1689f
      ISOLATED_WORKER_NAME: xeomx-stage54-exact-golden-20260815
      TARGET_BRANCH: verify/stage5-4-exact-golden-20260815
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct checksum-verified overlay
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$PAYLOAD_BRANCH"
          for n in 00 01 02 03 04 05 06 07; do git show "FETCH_HEAD:.xeomx-stage54-core-v2/core.$n" > "/tmp/core.$n"; done
          cat > /tmp/core-v2.sha256 <<'EOF'
          02515ae3d3d40640df39bcd54261b1048e6ba90ae9d46dfee5df988bc945eb32  /tmp/core.00
          37c231c2aef38b7925bc95bf4fffdf9024a1a093ba2c174509b8311e3cc5b9bc  /tmp/core.01
          85a737b8e47823eeb27eefa0d790f28c0dc9b880cfcf8eefac95b82873bb20e4  /tmp/core.02
          632d7c49d68da6cc624426bd38d3c27c386b79b563c55e39bacabd0dda0f46bc  /tmp/core.03
          33437cc634b3574b819ece7c1f8efa164679084ef42e8f9f708c26ee40f9e179  /tmp/core.04
          1a05a12bfbdbf1b8b066af63055da23fdbe5b4db4c076a6a21b41a4e14dee141  /tmp/core.05
          a4ea7a4331cb509ca4e7d61ab68eb7f521ae4f46e693a47fe3453b29c13f67c2  /tmp/core.06
          b738c10a8617bc1ae53fdc1799695f80d2def47f385b7eb1333ee36db82ac32d  /tmp/core.07
          EOF
          sha256sum -c /tmp/core-v2.sha256
          cat /tmp/core.0{0,1,2,3,4,5,6,7} > /tmp/stage54-core.b64
          base64 -d /tmp/stage54-core.b64 > /tmp/stage54-core.tar.xz
          echo "$CORE_ARCHIVE_SHA256  /tmp/stage54-core.tar.xz" | sha256sum -c -
          xz -t /tmp/stage54-core.tar.xz

      - name: Checkout real staging source detached
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$STAGING_BRANCH"
          git checkout --detach FETCH_HEAD
          test "$(git branch --show-current)" = ""

      - name: Materialize Stage5.4 source
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/stage54-core.tar.xz -C .
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib/backend/vertical-slice.ts'); s=p.read_text()
          old='''export const REQUEST_7_LIVE_TEXT_PROVIDER = {
            id: "cloudflare",
            model: "@cf/meta/llama-3.1-8b-instruct-fast",
            reservedCreditUnits: 5,
          } as const;'''
          new='''export const REQUEST_7_TEXT_PROVIDER_ROUTES = [
            {
              id: "cloudflare",
              model: "@cf/meta/llama-3.1-8b-instruct-fast",
              reservedCreditUnits: 5,
            },
            { id: "gemini", model: "gemini-3.5-flash", reservedCreditUnits: 5 },
            { id: "groq", model: "llama-3.1-8b-instant", reservedCreditUnits: 5 },
          ] as const;

          export const REQUEST_7_LIVE_TEXT_PROVIDER = REQUEST_7_TEXT_PROVIDER_ROUTES[0];'''
          if s.count(old)!=1: raise SystemExit(f'vertical-slice block count={s.count(old)}')
          p.write_text(s.replace(old,new))
          p=Path('src/lib/backend/vertical-slice.server.ts'); s=p.read_text()
          if s.count('  REQUEST_7_LIVE_TEXT_PROVIDER,\n')!=1: raise SystemExit('server import mismatch')
          s=s.replace('  REQUEST_7_LIVE_TEXT_PROVIDER,\n','  REQUEST_7_TEXT_PROVIDER_ROUTES,\n')
          old='''  const route = REQUEST_7_LIVE_TEXT_PROVIDER;
            if (input.routingMode === "manual") {
              if (input.requestedProvider !== route.id) throw new VerticalSliceError("PROVIDER_UNAVAILABLE");
              if (input.requestedModel !== route.model) throw new VerticalSliceError("MODEL_UNAVAILABLE");
            }'''
          new='''  if (input.routingMode === "manual") {
            const providerRoutes = REQUEST_7_TEXT_PROVIDER_ROUTES.filter(
              (route) => route.id === input.requestedProvider,
            );
            if (!providerRoutes.length) throw new VerticalSliceError("PROVIDER_UNAVAILABLE");
            if (!providerRoutes.some((route) => route.model === input.requestedModel)) {
              throw new VerticalSliceError("MODEL_UNAVAILABLE");
            }
          }'''
          if s.count(old)!=1: raise SystemExit(f'server routing block count={s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          grep -q '"@lovable.dev/vite-tanstack-config": "2.8.5"' package.json
          grep -q '"@lovable.dev/vite-tanstack-config": "2.8.5"' package-lock.json
          git diff --check

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fresh exact npm install
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts=false
          actual="$(node -p "require('./node_modules/@lovable.dev/vite-tanstack-config/package.json').version")"
          test "$actual" = '2.8.5'

      - name: Production build and route generation
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Apply scoped ESLint autofix only to touched/generated files
        shell: bash
        run: |
          set -euo pipefail
          npx eslint src/lib/backend/vertical-slice.ts src/lib/backend/vertical-slice.server.ts src/routeTree.gen.ts --fix
          git diff --check
          git diff -- src/lib/backend/vertical-slice.ts src/lib/backend/vertical-slice.server.ts src/routeTree.gen.ts > /tmp/stage54-lint-fix.patch

      - name: Full lint gate
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/stage54-lint-after-fix.log
          exit ${PIPESTATUS[0]}

      - name: Publish lint patch and diagnostics to verification branch only
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          publish() {
            local src="$1" path="$2" msg="$3"
            [ -f "$src" ] || : > "$src"
            local content api sha
            content="$(base64 -w0 "$src")"
            api="repos/${GITHUB_REPOSITORY}/contents/$path"
            sha="$(gh api "$api?ref=$TARGET_BRANCH" --jq '.sha' 2>/dev/null || true)"
            args=(--method PUT "$api" -f message="[skip ci] $msg" -f content="$content" -f branch="$TARGET_BRANCH")
            if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
            gh api "${args[@]}" >/dev/null
          }
          publish /tmp/stage54-lint-fix.patch .xeomx-diagnostics/stage54-lint-fix-2026-08-15.patch 'stage5.4: persist lint autofix patch'
          publish /tmp/stage54-lint-after-fix.log .xeomx-diagnostics/stage54-lint-after-fix-2026-08-15.log 'stage5.4: persist post-fix lint diagnostics'

      - name: Enforce lint gate
        if: steps.lint.outcome != 'success'
        run: exit 1

      - name: Full tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Migration tests
        run: npm run test:migrations

      - name: Build smoke
        run: npm run test:smoke

      - name: Secret pattern gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=node_modules --exclude-dir=.git --exclude='package-lock.json' --exclude='*.md' '(sk_live_|AIza[0-9A-Za-z_-]{20,}|gsk_[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' src supabase tests package.json 2>/dev/null; then exit 1; fi
          echo 'SECRET_PATTERN_GATE=PASS'

      - name: Deploy only isolated Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --name "$ISOLATED_WORKER_NAME" 2>&1 | tee /tmp/wrangler-deploy.log

      - name: Record scope
        if: always()
        shell: bash
        run: |
          {
            echo '## XEOMX Stage5.4 Remediation Gate'
            echo "- Base: $STAGING_BRANCH (detached only)"
            echo "- Payload: $PAYLOAD_BRANCH"
            echo "- Worker: $ISOLATED_WORKER_NAME"
            echo '- No merge. No main write. No production DNS.'
          } >> "$GITHUB_STEP_SUMMARY"
