name: XEOMX Stage5.4 Exact Isolated Gate

on:
  push:
    branches:
      - verify/stage5-4-exact-golden-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      STAGING_BRANCH: staging/xeomx-request7-cloudflare-live
      PAYLOAD_BRANCH: payload/stage54-core-v2-20260815
      CORE_ARCHIVE_SHA256: e5e99cfea3ccdbe206e5e19104ff4890837ecf7d4dadc15cc3f140eaf5c1689f
      ISOLATED_WORKER_NAME: xeomx-stage54-exact-golden-20260815
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct and verify Stage5.4 core v2 overlay
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$PAYLOAD_BRANCH"
          for n in 00 01 02 03 04 05 06 07; do
            git show "FETCH_HEAD:.xeomx-stage54-core-v2/core.$n" > "/tmp/core.$n"
          done
          cat > /tmp/core-v2.sha256 <<'EOF'
          02515ae3d3d40640df39bcd54261b1048e6ba90ae9d46dfee5df988bc945eb32  /tmp/core.00
          37c231c2aef38b7925bc95bf4fffdf9024a1a093ba2c174509b8311e3cc5b9bc  /tmp/core.01
          85a737b8e47823eeb27eefa0d790f28c0dc9b880cfcf8eefac95b82873bb20e4  /tmp/core.02
          632d7c49d68da6cc624426bd38d3c27c386b79b563c55e39bacabd0dda0f46bc  /tmp/core.03
          33437cc634b3574b819ece7c1f8efa164679084ef42e8f9f708c26ee40f9e179  /tmp/core.04
          1a05a12bfbdbf1b8b066af63055da23fdbe5b4db4c076a6a21b41a4e14dee141  /tmp/core.05
          a4ea7a4331cb509ca4e7d61ab68eb7f521ae4f46e693a47fe3453b29c13f67c2  /tmp/core.06
          b738c10a8617bc1ae53fdc1799695f80d2def47f385b7eb1333ee36db82ac32d  /tmp/core.07
          EOF
          sha256sum -c /tmp/core-v2.sha256
          cat /tmp/core.00 /tmp/core.01 /tmp/core.02 /tmp/core.03 /tmp/core.04 /tmp/core.05 /tmp/core.06 /tmp/core.07 > /tmp/stage54-core.b64
          base64 -d /tmp/stage54-core.b64 > /tmp/stage54-core.tar.xz
          echo "$CORE_ARCHIVE_SHA256  /tmp/stage54-core.tar.xz" | sha256sum -c -
          xz -t /tmp/stage54-core.tar.xz
          tar -tJf /tmp/stage54-core.tar.xz > /tmp/stage54-core.list
          grep -qx 'package.json' /tmp/stage54-core.list
          grep -qx 'package-lock.json' /tmp/stage54-core.list
          echo 'CORE_V2_OVERLAY=VERIFIED'

      - name: Checkout real staging source without modifying staging branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$STAGING_BRANCH"
          git checkout --detach FETCH_HEAD
          echo "BASE_SHA=$(git rev-parse HEAD)"
          test "$(git branch --show-current)" = ""

      - name: Materialize exact Stage5.4 overlay
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/stage54-core.tar.xz -C .
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/backend/vertical-slice.ts')
          s = p.read_text()
          old = '''export const REQUEST_7_LIVE_TEXT_PROVIDER = {
            id: "cloudflare",
            model: "@cf/meta/llama-3.1-8b-instruct-fast",
            reservedCreditUnits: 5,
          } as const;'''
          new = '''export const REQUEST_7_TEXT_PROVIDER_ROUTES = [
            {
              id: "cloudflare",
              model: "@cf/meta/llama-3.1-8b-instruct-fast",
              reservedCreditUnits: 5,
            },
            { id: "gemini", model: "gemini-3.5-flash", reservedCreditUnits: 5 },
            { id: "groq", model: "llama-3.1-8b-instant", reservedCreditUnits: 5 },
          ] as const;

          export const REQUEST_7_LIVE_TEXT_PROVIDER = REQUEST_7_TEXT_PROVIDER_ROUTES[0];'''
          if s.count(old) != 1:
              raise SystemExit(f'vertical-slice.ts expected block count=1, got {s.count(old)}')
          p.write_text(s.replace(old, new))

          p = Path('src/lib/backend/vertical-slice.server.ts')
          s = p.read_text()
          old_import = '  REQUEST_7_LIVE_TEXT_PROVIDER,\n'
          new_import = '  REQUEST_7_TEXT_PROVIDER_ROUTES,\n'
          if s.count(old_import) != 1:
              raise SystemExit(f'server import count expected=1, got {s.count(old_import)}')
          s = s.replace(old_import, new_import)
          old_block = '''  const route = REQUEST_7_LIVE_TEXT_PROVIDER;
            if (input.routingMode === "manual") {
              if (input.requestedProvider !== route.id) throw new VerticalSliceError("PROVIDER_UNAVAILABLE");
              if (input.requestedModel !== route.model) throw new VerticalSliceError("MODEL_UNAVAILABLE");
            }'''
          new_block = '''  if (input.routingMode === "manual") {
            const providerRoutes = REQUEST_7_TEXT_PROVIDER_ROUTES.filter(
              (route) => route.id === input.requestedProvider,
            );
            if (!providerRoutes.length) throw new VerticalSliceError("PROVIDER_UNAVAILABLE");
            if (!providerRoutes.some((route) => route.model === input.requestedModel)) {
              throw new VerticalSliceError("MODEL_UNAVAILABLE");
            }
          }'''
          if s.count(old_block) != 1:
              raise SystemExit(f'server routing block expected=1, got {s.count(old_block)}')
          p.write_text(s.replace(old_block, new_block))
          PY
          grep -q '"@lovable.dev/vite-tanstack-config": "2.8.5"' package.json
          grep -q '"@lovable.dev/vite-tanstack-config": "2.8.5"' package-lock.json
          git diff --check
          echo 'STAGE54_SOURCE=RECONSTRUCTED'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fresh exact npm install
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts=false
          actual="$(node -p "require('./node_modules/@lovable.dev/vite-tanstack-config/package.json').version")"
          echo "INSTALLED_VITE_TANSTACK_CONFIG=$actual"
          test "$actual" = '2.8.5'

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Full tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Migration tests
        run: npm run test:migrations

      - name: Production build
        run: npm run build

      - name: Build smoke
        run: npm run test:smoke

      - name: Secret pattern gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=node_modules --exclude-dir=.git --exclude='package-lock.json' --exclude='*.md' '(sk_live_|AIza[0-9A-Za-z_-]{20,}|gsk_[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' src supabase tests package.json 2>/dev/null; then
            echo 'Potential credential-like material found' >&2
            exit 1
          fi
          echo 'SECRET_PATTERN_GATE=PASS'

      - name: Deploy only isolated Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --name "$ISOLATED_WORKER_NAME" 2>&1 | tee /tmp/wrangler-deploy.log

      - name: Record verification scope
        if: always()
        shell: bash
        run: |
          {
            echo '## XEOMX Stage 5.4 exact isolated gate'
            echo "- Base staging branch: $STAGING_BRANCH"
            echo "- Payload branch: $PAYLOAD_BRANCH"
            echo "- Isolated worker target: $ISOLATED_WORKER_NAME"
            echo "- Core overlay SHA256: $CORE_ARCHIVE_SHA256"
            echo '- No merge performed.'
            echo '- No main branch write performed.'
            echo '- No production DNS route configured by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
