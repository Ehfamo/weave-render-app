name: XEOMX Stage5.4 Exact Patch Probe

on:
  push:
    branches:
      - staging/xeomx-request7-cloudflare-live
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download exact Stage5.4 patch from Golden Drive handoff
        shell: bash
        run: |
          set -euo pipefail
          url='https://drive.usercontent.google.com/download?id=1RQ4C40djhRayMYa0Cc94W1JX1pmiVMay&export=download&confirm=t'
          code="$(curl -L --silent --show-error --output /tmp/stage54.patch.xz --write-out '%{http_code}' "$url" || true)"
          echo "HTTP_STATUS=$code"
          echo "BYTES=$(wc -c </tmp/stage54.patch.xz 2>/dev/null || echo 0)"
          test "$code" = "200"
          echo '1073f45550da69eea94f9dc9fbc385910225ed43295de01bbf4a3c35a8366113  /tmp/stage54.patch.xz' | sha256sum -c -
