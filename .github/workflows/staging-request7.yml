name: XEOMX Stage5.4 Payload Recovery

on:
  push:
    branches:
      - verify/stage5-4-exact-golden-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Inspect staged Golden reconstruction payloads
        shell: bash
        run: |
          set -u
          echo '=== TREE ==='
          find .xeomx-stage54 .xeomx-stage54-small -maxdepth 1 -type f -printf '%p %s bytes\n' 2>/dev/null | sort

          inspect_set() {
            label="$1"; shift
            out="/tmp/${label}.xz"
            : > "$out.b64"
            for f in "$@"; do
              [ -f "$f" ] || continue
              tr -d '\r\n ' < "$f" >> "$out.b64"
            done
            echo "=== $label ==="
            echo "B64_BYTES=$(wc -c < "$out.b64")"
            if base64 -d "$out.b64" > "$out" 2>/tmp/${label}.b64.err; then
              echo "BASE64=PASS"
              echo "XZ_BYTES=$(wc -c < "$out")"
              sha256sum "$out"
              if xz -t "$out" 2>/tmp/${label}.xz.err; then
                echo "XZ=PASS"
                xz -dc "$out" > "/tmp/${label}.decoded"
                echo "DECODED_BYTES=$(wc -c < /tmp/${label}.decoded)"
                file "/tmp/${label}.decoded" || true
                if tar -tf "/tmp/${label}.decoded" >/tmp/${label}.tar.list 2>/tmp/${label}.tar.err; then
                  echo "TAR=PASS"
                  sed -n '1,80p' /tmp/${label}.tar.list
                else
                  echo "TAR=NO"
                  head -c 200 "/tmp/${label}.decoded" | xxd || true
                fi
              else
                echo "XZ=INCOMPLETE_OR_INVALID"
                cat /tmp/${label}.xz.err || true
              fi
            else
              echo "BASE64=FAIL"
              cat /tmp/${label}.b64.err || true
            fi
          }

          inspect_set small .xeomx-stage54-small/payload.*
          inspect_set small_with_rest .xeomx-stage54-small/payload.* .xeomx-stage54-small/rest.*
          inspect_set primary .xeomx-stage54/payload.*
