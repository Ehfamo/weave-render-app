name: XEOMX Request7 Staging

on:
  push:
    branches:
      - staging/xeomx-request7-cloudflare-live
  workflow_dispatch:

concurrency:
  group: xeomx-request7-staging
  cancel-in-progress: true

env:
  SUPABASE_URL: https://bzoikmppvwiidyjdaqgv.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_PUISWn93BXooGndzl06Ovw_locHt1Gz
  VITE_SUPABASE_URL: https://bzoikmppvwiidyjdaqgv.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_PUISWn93BXooGndzl06Ovw_locHt1Gz

jobs:
  quality-and-staging-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build against isolated Staging (also regenerates route tree)
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Smoke test deploy package
        run: npm run test:smoke
      - name: Deploy isolated Staging Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.106.0 deploy \
            --name xeomx-request7-staging \
            --var SUPABASE_URL:${SUPABASE_URL} \
            --var SUPABASE_PUBLISHABLE_KEY:${SUPABASE_PUBLISHABLE_KEY} \
            2>&1 | tee wrangler-deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Preserve staging deploy evidence
        uses: actions/upload-artifact@v4
        with:
          name: xeomx-request7-staging-deploy
          path: wrangler-deploy.log
          if-no-files-found: error
          retention-days: 7
