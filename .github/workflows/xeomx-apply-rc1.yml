name: Apply XEOMX RC1 snapshot

on:
  push:
    branches:
      - release/xeomx-superapp-rc1-2
    paths:
      - .xeomx/READY

permissions:
  contents: write

jobs:
  apply-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify snapshot overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .xeomx/chunk-* > /tmp/overlay.b64
          base64 -d /tmp/overlay.b64 > /tmp/overlay.tar.xz
          echo '9b7e508ac38a28bf6b5748f7e625c6a7514f8b0f8eb4cc7a4740454779376670  /tmp/overlay.tar.xz' | sha256sum -c -
          tar -xJf /tmp/overlay.tar.xz
          if [ -f .xeomx-delete-manifest ]; then
            while IFS= read -r path; do
              [ -z "$path" ] || rm -f -- "$path"
            done < .xeomx-delete-manifest
            rm -f .xeomx-delete-manifest
          fi
          rm -rf .xeomx
          rm -f .github/workflows/xeomx-apply-rc1.yml

      - name: Commit restored release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: restore XEOMX super app release candidate'
          git push origin HEAD:release/xeomx-superapp-rc1-2
